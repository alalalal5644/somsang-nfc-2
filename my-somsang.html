<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="robots" content="noindex">
<title>MY SOMSANG · 내 키링 관리 | 솜생</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pretendard/1.3.9/static/pretendard.min.css">
<link rel="stylesheet" href="nfc/css/nfc.css">
</head>
<body class="admin-body">

<div class="demo-bar" id="demoBar" hidden></div>

<header class="nfc-nav">
  <div class="nfc-nav-inner">
    <a class="brand-lockup" id="homeLink" href="index.html" aria-label="솜생 홈">
      <span class="brand-mark" id="logo"></span>
      <span class="brand-divider" aria-hidden="true"></span>
      <span class="brand-sub">MY SOMSANG</span>
    </a>
    <div class="nav-right">
      <button type="button" class="btn btn-ghost btn-sm" id="logoutBtn" hidden><i class="fa-solid fa-arrow-right-from-bracket"></i>로그아웃</button>
    </div>
  </div>
</header>

<main class="admin-main">
  <div class="container" id="app">
    <div class="state"><div class="skeleton" style="width:64px;height:64px"></div><span class="sr-only">불러오는 중</span></div>
  </div>
</main>

<div class="save-bar" id="saveBar" role="region" aria-label="저장">
  <div class="save-bar-inner">
    <span><i class="fa-regular fa-pen-to-square"></i> 저장하지 않은 변경사항이 있어요</span>
    <div style="display:flex;gap:8px;">
      <button type="button" class="btn btn-line btn-sm" id="discardBtn">되돌리기</button>
      <button type="button" class="btn btn-primary btn-sm" id="saveBtn">저장하기</button>
    </div>
  </div>
</div>

<script src="nfc/js/config.js"></script>
<script src="nfc/js/sample-data.js"></script>
<script src="nfc/js/ui.js"></script>
<script src="nfc/js/store.js"></script>
<script src="nfc/js/admin.js"></script>
</body>
</html>
